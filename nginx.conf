server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Coolify / load balancer health check
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Never cache the entry points: a new deploy must be picked up on the next visit (the service worker updates itself).
  location = /index.html          { add_header Cache-Control "no-cache"; }
  location = /sw.js               { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path (/holdings, /accounts, ...) serves index.html and the router takes over.
  location / {
    try_files $uri /index.html;
  }
}
